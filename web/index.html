<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>belay</title>
<meta name="theme-color" content="#171a21">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f1115'/%3E%3Cpath d='M7 10h18M7 16h12M7 22h8' stroke='%234c8dff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">

</header>
<div id="workspace">
  <nav id="rail" aria-label="Sidebars"></nav>
  <aside id="side" class="hidden"></aside>

<div id="toasts"></div>
<script type="module" src="/app.js"></script>

</html>
